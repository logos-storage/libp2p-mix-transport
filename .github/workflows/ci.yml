name: CI

on:
  push:
    branches: [master]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NIMBLE_FLAGS: "-y"

jobs:
  build-and-test:
    name: Build and test (libp2p ${{ matrix.libp2p }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        libp2p: ["2.4.0", "2.5.0"]

    steps:
      - uses: actions/checkout@v6

      - name: Pin libp2p ${{ matrix.libp2p }}
        run: |
          sed -i 's/^requires "libp2p >= 2.4.0"$/requires "libp2p == ${{ matrix.libp2p }}"/' libp2p_mix_transport.nimble
          grep -q '^requires "libp2p == ${{ matrix.libp2p }}"$' libp2p_mix_transport.nimble

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.10"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Nimble dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.nimble/pkgcache
            nimbledeps/bin
            nimbledeps/pkgs2
            nimbledeps/nimbledata2.json
          key: nimble-${{ runner.os }}-2.2.10-libp2p-${{ matrix.libp2p }}-${{ hashFiles('libp2p_mix_transport.nimble') }}
          restore-keys: |
            nimble-${{ runner.os }}-2.2.10-libp2p-${{ matrix.libp2p }}-

      - name: Install dependencies
        run: |
          nim --version
          nimble --version
          make setup NIMBLE_FLAGS="$NIMBLE_FLAGS"

      - name: Test
        run: make test NIMBLE_FLAGS="$NIMBLE_FLAGS"

      - name: Build examples
        run: make example NIMBLE_FLAGS="$NIMBLE_FLAGS"
